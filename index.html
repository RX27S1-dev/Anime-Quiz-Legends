<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime Quiz Legends</title>

    <link rel="stylesheet" href="QuizWeb.css">

</head>

<body>

    <!-- MUSIC -->

    <audio id="bgMusic" autoplay loop>
        <source src="Rubikdice_-_MONTAGEM_PEGADORA_Slowed__@BaseNaija.mp3" type="audio/mp3">
    </audio>

    <!-- SCORE -->

    <div class="box">

        <h2 id="score">Score: 0</h2>

    </div>

    <!-- TOP BUTTONS -->

    <div class="topButtons">

        <button id="refreshBtn">🔄 Refresh</button>

        <button id="musicBtn">⏸ Pause Music</button>

    </div>

    <!-- START SCREEN -->

    <div id="startScreen">

        <h1>🔥 Anime Quiz Legends 🔥</h1>

        <!-- CATEGORY -->

        <select id="categorySelect">

            <option value="all">All Anime</option>
            <option value="naruto">Naruto</option>
            <option value="dbz">Dragon Ball</option>
            <option value="onepiece">One Piece</option>
            <option value="jjk">Jujutsu Kaisen</option>

        </select>

        <!-- DIFFICULTY -->

        <select id="difficultySelect">

            <option value="easy">Easy</option>
            <option value="normal">Normal</option>
            <option value="hard">Hard</option>

        </select>

        <br>

        <input type="text" id="usernameInput" placeholder="Enter Username">

        <br>

        <button id="startBtn">▶ Start Game</button>

    </div>

    <!-- QUIZ -->

    <div class="question" id="quizBox" style="display:none;">

        <h2 id="timer">Time: 10</h2>

        <h2 id="progress">Question 1 / 1</h2>

        <h2 id="highScore">High Score: 0</h2>

        <h2 id="playerName"></h2>

        <h2 id="levelText">Level 1 Beginner</h2>

<div class="xpContainer">

    <div id="xpBar"></div>

</div>

        <h2 id="streak">🔥 Streak: 0</h2>

        <h1>Anime Quiz</h1>

          

        <p id="questionText"></p>

        <div class="answers">

            <button class="answerBtn"></button>
            <button class="answerBtn"></button>
            <button class="answerBtn"></button>

        </div>

    </div>

    <script src="QuizWeb.js"></script>

</body>

</html>
